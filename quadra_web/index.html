<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadra | Advanced Forger</title>
    <meta name="description" content="Advanced 4-Letter Minecraft Username Forger">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="container">
        <header class="glass-panel">
            <h1 class="logo">QUADRA</h1>
            <p class="subtitle">Advanced 4-Letter Minecraft Username Forger</p>
        </header>

        <section class="controls glass-panel">
            <div class="input-group">
                <label for="attempts">Target Attempts</label>
                <input type="number" id="attempts" value="100" min="1" max="10000">
            </div>
            <div class="input-group">
                <label for="delay">Delay (Seconds)</label>
                <input type="number" id="delay" value="2.0" step="0.1" min="0.5">
            </div>
            
            <div class="button-group">
                <button id="startBtn" class="btn btn-primary">
                    <span class="btn-text">START FORGING</span>
                    <div class="btn-glow"></div>
                </button>
                <button id="stopBtn" class="btn btn-danger hidden">
                    <span class="btn-text">STOP FORGING</span>
                </button>
            </div>
        </section>

        <section class="status glass-panel">
            <div class="status-header">
                <h2>Live Status</h2>
                <span id="currentStatus" class="status-badge idle">Idle</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-stats">
                    <span id="checkedCount">Checked: 0 / 100</span>
                    <span id="foundCount">Found: 0</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>
            
            <div id="activeUsername" class="active-username">
                Waiting for command...
            </div>
        </section>

        <section class="results glass-panel">
            <div class="results-header">
                <h2>Available Names</h2>
                <button id="copyBtn" class="btn btn-secondary btn-small">Copy All</button>
            </div>
            <div id="resultsList" class="results-grid">
                <!-- Found names will appear here -->
            </div>
            <div id="emptyState" class="empty-state">
                <p>No available names found yet.</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
